NAME: SignGPT_stage2_${oc.env:SIGNGPT_RUN_TAG,minirun}
ACCELERATOR: gpu
NUM_NODES: 1
DEVICE: [0]

TRAIN:
  SPLIT: train
  STAGE: lm_pretrain
  NUM_WORKERS: 2
  BATCH_SIZE: 2
  END_EPOCH: 2
  RESUME: ''
  PRETRAINED: null
  PRETRAINED_VAE: ${oc.env:SIGNGPT_VAE_CKPT,''}
  OPTIM:
    target: AdamW
    params:
      lr: 1e-5
      betas: [0.9, 0.99]
      weight_decay: 0.05
  LR_SCHEDULER:
    target: CosineAnnealingLR
    params:
      T_max: 20
      eta_min: 1e-7

EVAL:
  SPLIT: test
  TEST_SPLIT: test
  BATCH_SIZE: 2
  NUM_WORKERS: 2

TEST:
  CHECKPOINTS: ${oc.env:SIGNGPT_CKPT,''}
  SPLIT: test
  BATCH_SIZE: 2

DATASET:
  target: mGPT.data.HumanML3D.HumanML3DDataModule
  CODE_PATH: signgpt_motion_tokens
  CODEBOOK_PARAMS_PATH: ${oc.env:SIGNGPT_CODEBOOK_PATH,./data/how2sign/codebook_params/signgpt_codebook.pt}

METRIC:
  TYPE: [TM2TMetrics]

LOSS:
  LAMBDA_CLS: 0
  LAMBDA_MOTION: 1.0
  LAMBDA_TEXT: 1.0
  ABLATION:
    RECONS_LOSS: l1_smooth

model:
  target: mGPT.models.mgpt.SignGPT
  params:
    condition: text
    task: t2m
    lm: ${lm.default}
    motion_vae: ${vq.default}

LOGGER:
  TYPE: []
  VAL_EVERY_STEPS: 1000
  WANDB:
    params:
      project: signgpt
