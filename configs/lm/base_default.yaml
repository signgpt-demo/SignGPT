target: mGPT.archs.mgpt_lm.Base_MLM
params:
  model_type: llama
  model_path: ${oc.env:SIGNGPT_LLM_PATH,./deps/llama-1b}
  my_task: mix
  init_from_scratch: false
  scratch_hidden_size: 2048
  scratch_intermediate_size: 8192
  scratch_num_hidden_layers: 16
  scratch_num_attention_heads: 32
  scratch_num_key_value_heads: 8
  scratch_max_position_embeddings: 131072
  scratch_attention_dropout: 0.0
  motion_codebook_size: ${model.params.motion_vae.params.vae_args_body.code_num}
  max_length: 320
  down_t: ${model.params.motion_vae.params.vae_args_body.stride_t}
  framerate: 20.0
  predict_ratio: 0.2
  inbetween_ratio: 0.25
  new_token_type: insert
  lora: false
